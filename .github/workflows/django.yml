name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Spins up a temporary PostgreSQL instance for your tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chaigallery_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' # Matches your Render environment

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        # Overrides your database URL to use the temporary container above
        DATABASE_URL: postgresql://chaiuser:chaipassword@localhost/chaigallery_test_db
        DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-test-key-not-for-production"
      run: |
        python manage.py test
